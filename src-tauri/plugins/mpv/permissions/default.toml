[default]
description = "Everything the player screen needs: start, control and stop mpv, and show it in Now Playing."
permissions = [
    "allow-start",
    "allow-command",
    "allow-set",
    "allow-get",
    "allow-stop",
    "allow-orientation",
    "allow-thumb-frame",
    "allow-thumb-close",
    "allow-now-playing",
    "allow-now-playing-clear",
    "allow-register-listener",
    "allow-remove-listener",
]
