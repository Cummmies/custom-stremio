<!doctype html>
<!--
    The app's trailer player, served from GitHub Pages (.github/workflows/pages.yml).
    YouTube refuses an embed that doesn't say which website it's on (Error 153),
    and the iOS app (tauri://) and the TV (a local file) aren't on one: they show
    this page, whose address YouTube can see. ?v=<YouTube video id>
-->
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Trailer</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            background: #000;
        }
        iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>
    <script>
        // Written for the TV's Chromium 69 too.
        var id = (location.search.match(/[?&]v=([A-Za-z0-9_-]{6,20})(?:&|$)/) || [])[1];
        if (id) {
            var f = document.createElement('iframe');
            f.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0&modestbranding=1&playsinline=1';
            f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
            f.allowFullscreen = true;
            f.referrerPolicy = 'strict-origin-when-cross-origin';
            f.title = 'Trailer';
            document.body.appendChild(f);
        }
    </script>
</body>
</html>
