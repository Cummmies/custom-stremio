<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Custom Stremio TV Test</title>
<!-- Samsung's TV APIs (AVPlay etc.). Only resolves inside a Tizen app; the test reports whether it did. -->
<object id="avstatic" type="application/avplayer" style="position:absolute;left:0;top:0;width:1px;height:1px"></object>
<script src="$WEBAPIS/webapis/webapis.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Custom Stremio TV Test</h1><span class="ver" id="summary"></span>
  <span class="key">Last key: <b id="lastkey">press one</b></span>
</header>
<div id="results"><div id="cols"></div></div>
<div id="side">
  <div id="tests">
    <button data-test="html5-h264">1. HTML5 video: H.264 MP4 + thumbnail grab</button>
    <button data-test="html5-hevc">2. HTML5 video: HEVC HDR10 MKV, 2 audio + subs</button>
    <button data-test="avplay-h264">3. AVPlay: H.264 MP4</button>
    <button data-test="avplay-hevc">4. AVPlay: HEVC HDR10 MKV, tracks + subs</button>
    <button data-test="avplay-audio">5. AVPlay: switch to 2nd audio track</button>
    <button data-test="stop">6. Stop video</button>
    <button data-test="served">7. Installed app: reload this page from the service</button>
    <button data-test="storage">8. Installed app: copy this page to storage, open it</button>
  </div>
  <div id="stage"><div id="sub"></div><canvas id="thumb" width="160" height="90"></canvas></div>
  <div id="log"></div>
</div>
<script type="module" src="module-test.js"></script>
<script src="probe.js"></script>
</body>
</html>
