<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Custom Stremio TV Test</title>
<!-- Samsung's TV APIs (AVPlay etc.). Only resolves inside a Tizen app; the test reports whether it did. -->
<object id="avstatic" type="application/avplayer" style="position:absolute;left:0;top:0;width:1px;height:1px"></object>
<script src="$WEBAPIS/webapis/webapis.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background: #0d0d12; color: #e8e8ee;
    font: 17px/1.28 "Samsung One", "SamsungOne", Arial, sans-serif;
  }
  body.video-on { background: transparent; }
  body.video-on #results { background: #0d0d12; }
  header { height: 70px; padding: 16px 32px 0; display: -webkit-flex; display: flex; -webkit-align-items: baseline; align-items: baseline; }
  header h1 { margin: 0; font-size: 30px; }
  header .ver { margin-left: 20px; color: #9a9aaa; }
  header .key { margin-left: auto; font-size: 24px; }
  #results { position: absolute; left: 0; top: 70px; width: 1240px; height: 1010px; padding: 0 16px 0 32px; overflow: hidden; }
  #cols { -webkit-column-count: 4; column-count: 4; -webkit-column-gap: 22px; column-gap: 22px; height: 100%; -webkit-column-fill: auto; column-fill: auto; }
  section { -webkit-column-break-inside: avoid; break-inside: avoid; margin-bottom: 14px; }
  section h2 { margin: 0 0 4px; font-size: 18px; text-transform: uppercase; letter-spacing: .06em; color: #8f8fff; }
  .row { display: -webkit-flex; display: flex; padding: 1px 0; }
  .row .k { -webkit-flex: 1; flex: 1; color: #c8c8d4; margin-right: 6px; }
  .row .v { text-align: right; max-width: 170px; word-break: break-all; }
  .ok { color: #4ade80; } .no { color: #f87171; } .warn { color: #fbbf24; } .dim { color: #8a8a99; }
  #side { position: absolute; left: 1256px; top: 70px; width: 640px; height: 1010px; }
  #tests { padding: 0; }
  button {
    display: block; width: 100%; margin: 0 0 8px; padding: 10px 16px; text-align: left;
    font: inherit; font-size: 20px; color: #e8e8ee; background: #1d1d28; border: 3px solid transparent; border-radius: 10px;
  }
  button:focus { outline: none; border-color: #fff; background: #2c2c40; }
  #stage { position: relative; width: 640px; height: 300px; margin-top: 4px; border: 2px dashed #444; }
  #stage video { width: 100%; height: 100%; background: #000; }
  #stage object { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #sub { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 22px; text-shadow: 0 0 4px #000, 0 0 4px #000; }
  #thumb { position: absolute; right: 8px; top: 8px; width: 160px; height: 90px; border: 2px solid #fff; display: none; }
  #log { margin-top: 8px; height: 205px; overflow: hidden; font-size: 16px; color: #c8c8d4; white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>Custom Stremio TV Test</h1><span class="ver" id="summary"></span>
  <span class="key">Last key: <b id="lastkey">press one</b></span>
</header>
<div id="results"><div id="cols"></div></div>
<div id="side">
  <div id="tests">
    <button data-test="html5-h264">1. HTML5 video: H.264 MP4 + thumbnail grab</button>
    <button data-test="html5-hevc">2. HTML5 video: HEVC HDR10 MKV, 2 audio + subs</button>
    <button data-test="avplay-h264">3. AVPlay: H.264 MP4</button>
    <button data-test="avplay-hevc">4. AVPlay: HEVC HDR10 MKV, tracks + subs</button>
    <button data-test="avplay-audio">5. AVPlay: switch to 2nd audio track</button>
    <button data-test="stop">6. Stop video</button>
    <button data-test="served">7. Installed app: reload this page from the service</button>
    <button data-test="storage">8. Installed app: copy this page to storage, open it</button>
  </div>
  <div id="stage"><div id="sub"></div><canvas id="thumb" width="160" height="90"></canvas></div>
  <div id="log"></div>
</div>
<script type="module" src="module-test.js"></script>
<script src="probe.js"></script>
</body>
</html>
