# The GitHub Release for a version tag (v1.2.3): one release with all three
# apps. release.yml (Windows), ios.yml and tv.yml each run this, then add
# their file; whichever gets here first makes it. It's the latest release, so
# the desktop updater finds latest.json there and TizenBrew Installer its .wgt.
name: Release for this tag
description: Makes sure this tag's release exists, marked as the latest.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ github.ref_name }}
      run: |
        cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
        ## Install

        - **Windows**: the `_x64-setup.exe` installer. The app updates itself after that.
        - **iPhone / iPad**: `Stremio.ipa`. Sideload it with SideStore, AltStore, LiveContainer or Sideloadly (see the README).
        - **Samsung TV**: `Stremio.wgt`, installed by TizenBrew Installer (`Cummmies/custom-stremio`).

        The iPhone and TV apps also update their screens over the air between releases. Each file appears here when its build finishes; the iPhone and TV builds take longer than Windows.

        See the commits since the last release for what changed.
        EOF
        for i in 1 2 3; do
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          # Another build may make it at the same moment: look again.
          gh release create "$TAG" --verify-tag --latest --title "Stremio $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" && exit 0
          sleep $((i * 5))
        done
        gh release view "$TAG" >/dev/null
