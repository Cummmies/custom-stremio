# Builds a signed Windows installer and publishes a GitHub Release with the
# update manifest (latest.json) that the in-app updater reads. Releases go to
# the public Cummmies/custom-stremio-updates repo (this one is private, and
# the app downloads updates without signing in).
#
# To release: bump "version" in src-tauri/tauri.conf.json and package.json,
# commit, then push a tag like v0.2.0.
#
# Needs repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/custom-stremio.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  empty unless you set one
#   UPDATES_REPO_TOKEN                  Contents: read and write on the updates repo
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Bundle libmpv so the app plays video without a Stremio install.
      # shinchiro/mpv-winbuild-cmake publishes the builds mpv's own site links to.
      - name: Download libmpv
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The generic x86_64 build (not "-v3", which needs AVX2) runs on any 64-bit PC.
          gh release download --repo shinchiro/mpv-winbuild-cmake --pattern "mpv-dev-x86_64-2*.7z" --dir mpv
          7z x (Get-ChildItem mpv/*.7z | Select-Object -First 1).FullName -ompv/out -y
          Copy-Item mpv/out/libmpv-2.dll src-tauri/lib/libmpv-2.dll

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.UPDATES_REPO_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: Cummmies
          repo: custom-stremio-updates
          releaseCommitish: main
          tagName: ${{ github.ref_name }}
          releaseName: Custom Stremio ${{ github.ref_name }}
          releaseBody: See the commits since the last release for what changed.
          releaseDraft: false
          includeUpdaterJson: true
