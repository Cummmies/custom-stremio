# Builds a signed Windows installer and adds it, with the update manifest
# (latest.json) that the in-app updater reads, to the version's GitHub Release.
# The same tag also builds the iPhone app (ios.yml) and the TV app (tv.yml)
# into that release (.github/actions/release).
#
# To release: bump "version" in src-tauri/tauri.conf.json and package.json,
# commit, then push a tag like v0.2.0.
#
# Needs repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/custom-stremio.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  empty unless you set one
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # What's New lists recent commits (vite.config.js).
          fetch-depth: 100

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Bundle libmpv so the app plays video without a Stremio install.
      # shinchiro/mpv-winbuild-cmake publishes the builds mpv's own site links to.
      - name: Download libmpv
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The generic x86_64 build (not "-v3", which needs AVX2) runs on any 64-bit PC.
          gh release download --repo shinchiro/mpv-winbuild-cmake --pattern "mpv-dev-x86_64-2*.7z" --dir mpv
          7z x (Get-ChildItem mpv/*.7z | Select-Object -First 1).FullName -ompv/out -y
          Copy-Item mpv/out/libmpv-2.dll src-tauri/lib/libmpv-2.dll

      - uses: ./.github/actions/release
        if: startsWith(github.ref, 'refs/tags/')

      # A desktop-only release (v1.2.3-desktop) is still the latest one, where
      # TizenBrew Installer and new iPhone installs look for their files: they
      # get the newest TV and iPhone builds from the last release that has them.
      - name: Carry over the TV and iPhone files
        if: startsWith(github.ref, 'refs/tags/') && endsWith(github.ref_name, '-desktop')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          for prev in $(gh release list --limit 30 --exclude-drafts --json tagName --jq '.[].tagName'); do
            [ "$prev" = "$TAG" ] && continue
            if gh release view "$prev" --json assets --jq '.assets[].name' | grep -qx 'Stremio.wgt'; then
              mkdir -p carried
              gh release download "$prev" --dir carried --pattern 'Stremio.wgt' --pattern '*.ipa'
              gh release upload "$TAG" carried/* --clobber
              echo "Carried over from $prev: $(ls carried | tr '\n' ' ')"
              exit 0
            fi
          done
          echo "No earlier release with a TV build: nothing to carry over."

      # Which web build is inside the app, so an older over-the-air bundle is
      # never used over it (src-tauri/src/web_update.rs).
      - name: Stamp the built-in web build
        shell: bash
        run: echo "WEB_BUILD_VERSION=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Stremio ${{ github.ref_name }}
          releaseBody: See the commits since the last release for what changed.
          releaseDraft: false
          includeUpdaterJson: true
          # The updater's default download is the setup .exe (what people
          # install), which updates in place: the .msi installs as a separate app
          # next to it. (An app that knows it came from the .msi gets the .msi.)
          updaterJsonPreferNsis: true
