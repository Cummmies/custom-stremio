# Builds an unsigned iOS app (.ipa) for sideloading with SideStore, AltStore or
# Sideloadly, which sign it with your own Apple ID when they install it.
#
# Run it from the Actions tab (Run workflow), or push a v* tag to also attach
# the .ipa to that release. The .ipa is under the run's Artifacts.
name: iOS

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The Xcode project is generated, not committed, so it always matches the
      # Tauri version in package.json.
      - name: Generate the Xcode project
        run: npx tauri ios init --ci

      # No Apple developer account here: --no-sign builds an unsigned .ipa, and
      # the sideloading app signs it when it installs it on your iPhone.
      # XCODE_XCCONFIG_FILE applies these settings to every xcodebuild the Tauri
      # CLI runs.
      - name: Build
        env:
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/unsigned.xcconfig
        run: |
          cat > unsigned.xcconfig <<'EOF'
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          CODE_SIGN_ENTITLEMENTS =
          DEVELOPMENT_TEAM =
          EOF
          npx tauri ios build --target aarch64 --no-sign --ci

      - name: Package the .ipa
        run: |
          IPA=$(find src-tauri/gen/apple/build -maxdepth 3 -name '*.ipa' | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::No .ipa was built. See the Build step's log."
            find src-tauri/gen/apple/build -maxdepth 4 | head -50 || true
            exit 1
          fi
          cp "$IPA" CustomStremio.ipa
          ls -lh CustomStremio.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: CustomStremio-ios
          path: CustomStremio.ipa

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" CustomStremio.ipa --clobber
