# The Samsung TV app (docs/samsung-tv.md).
#
# app: builds the app's TV version (hash routing, Stremio's core compiled for
#   the TV's WebAssembly) and packages it as an installable TV app (.wgt)
#   signed with the certificate from tv-cert.yml.
#   - A push to main: the over-the-air update (src/lib/tv/webUpdate.ts): its
#     files go to the tv-web branch, its manifest (tv-web.json) and the .wgt to
#     the "tv" pre-release (a fixed address the installed app checks).
#   - A v* tag: the .wgt goes to that version's release, next to the Windows
#     and iPhone apps (.github/actions/release). That's the latest release,
#     where TizenBrew Installer finds it: Cummmies/custom-stremio.
# purge: the tv/ test module is loaded by TizenBrew through jsDelivr, which
#   caches a branch's files for up to 12 hours; this clears that cache.
name: TV

on:
  push:
    branches: [main]
    # Path filters don't apply to tags: every version tag builds it.
    tags: ['v*']
    paths:
      - 'src/**'
      - 'static/**'
      - 'package.json'
      - 'package-lock.json'
      - 'svelte.config.js'
      - 'vite.config.js'
      - 'scripts/build-core-tv.sh'
      - 'scripts/strip-wasm-section.py'
      - 'scripts/check-wasm-features.mjs'
      - 'scripts/tv-boot.mjs'
      - 'scripts/tv-legacy-css.mjs'
      - 'tv/**'
      - '.github/workflows/tv.yml'
      - '.github/actions/core-tv/**'
  workflow_dispatch:

# A tag's build doesn't cancel main's (pushed together when releasing).
concurrency:
  group: tv-${{ github.ref }}
  cancel-in-progress: true

env:
  TIZEN_STUDIO_VER: '5.6'

jobs:
  app:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check the certificate secrets
        id: secrets
        env:
          KEY: ${{ secrets.TIZEN_AUTHOR_KEY }}
          PW: ${{ secrets.TIZEN_AUTHOR_KEY_PW }}
        run: |
          if [ -z "$KEY" ] || [ -z "$PW" ]; then
            echo "::warning::No certificate yet (see tv-cert.yml): signing with a throwaway one to test the build; not publishing."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Stremio's core built for the TVs' WebAssembly (cached per version).
      - uses: ./.github/actions/core-tv
        id: core

      - name: Build the app (TV)
        env:
          TV_BUILD: '1'
          CORE_DIR: ${{ steps.core.outputs.dir }}
        run: |
          # Hash routing allows no page options; ssr = false is implied there.
          sed -i '/export const ssr/d' src/routes/+layout.ts
          npm run build
          # Relative paths, the boot script (installed or downloaded copy), the
          # update manifest. The version is the commit's time, like iOS's.
          node scripts/tv-boot.mjs build "$(git log -1 --format=%ct)"

      - name: Install Tizen Studio (command line)
        run: |
          sudo apt-get install -y expect
          curl -fsSLo tizen-installer "https://download.tizen.org/sdk/Installer/tizen-studio_${TIZEN_STUDIO_VER}/web-cli_Tizen_Studio_${TIZEN_STUDIO_VER}_ubuntu-64.bin"
          chmod +x tizen-installer
          ./tizen-installer --accept-license "$HOME/tizen-studio"
          rm tizen-installer
          echo "TIZEN=$HOME/tizen-studio/tools/ide/bin/tizen" >> "$GITHUB_ENV"

      # Our author certificate, and the SDK's public distributor certificate
      # (the one Tizen 6.5 and older TVs accept in developer mode).
      - name: Set up signing
        env:
          KEY: ${{ secrets.TIZEN_AUTHOR_KEY }}
          PW: ${{ secrets.TIZEN_AUTHOR_KEY_PW }}
        run: |
          DATA="$HOME/tizen-signing"
          mkdir -p "$DATA"
          if [ -n "$KEY" ] && [ -n "$PW" ]; then
            echo "$KEY" | base64 -d > "$DATA/author.p12"
          else
            PW=throwaway
            "$TIZEN" certificate -a Throwaway -p "$PW" -c US -n "Throwaway" -f throwaway-author
            cp "$(find "$HOME" -name 'throwaway-author.p12' | head -1)" "$DATA/author.p12"
          fi
          SDK="$HOME/tizen-studio/tools/certificate-generator/certificates"
          cat > "$DATA/profiles.xml" <<XML
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <profiles active="CustomStremio" version="3.1">
          <profile name="CustomStremio">
          <profileitem ca="$SDK/developer/tizen-developer-ca.cer" distributor="0" key="$DATA/author.p12" password="$PW" rootca=""/>
          <profileitem ca="$SDK/distributor/sdk-public/tizen-distributor-ca.cer" distributor="1" key="$SDK/distributor/sdk-public/tizen-distributor-signer.p12" password="tizenpkcs12passfordsigner" rootca=""/>
          <profileitem ca="" distributor="2" key="" password="" rootca=""/>
          </profile>
          </profiles>
          XML
          sed -i 's/^ *//' "$DATA/profiles.xml"
          "$TIZEN" cli-config "profiles.path=$DATA/profiles.xml"

      - name: Assemble
        run: |
          rm -rf wgt && mkdir wgt
          cp -r build/. wgt/
          cp tv/wgt/config.xml wgt/
          cp tv/wgt/icon.png wgt/icon.png
          # A new version each build, so the TV takes it as an update.
          sed -i "s/version=\"0.1.0\"/version=\"0.1.${{ github.run_number }}\"/" wgt/config.xml
          du -sh wgt

      - name: Build and sign
        run: |
          cd wgt
          "$TIZEN" build-web -e ".*"
          expect -c "set timeout 300; spawn $TIZEN package -t wgt -s CustomStremio -o $GITHUB_WORKSPACE/out -- .buildResult; expect eof"
          cd ..
          WGT=$(ls out/*.wgt | head -1)
          if [ -z "$WGT" ]; then
            cat "$HOME"/tizen-studio-data/cli/logs/cli.log 2>/dev/null | tail -50 || true
            echo "::error::No .wgt was made."
            exit 1
          fi
          mv "$WGT" Stremio.wgt
          ls -lh Stremio.wgt
          unzip -l Stremio.wgt | grep -E "signature|config.xml|index.html|\.wasm"

      - uses: actions/upload-artifact@v4
        with:
          name: Stremio-tv
          path: Stremio.wgt

      # The installed app updates from tv-web.json (files on the tv-web branch).
      - name: Publish the over-the-air update
        if: steps.secrets.outputs.ok == 'true' && github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The update's files first, so the manifest never points at missing ones.
          rm -rf "$RUNNER_TEMP/tv-web" && mkdir "$RUNNER_TEMP/tv-web"
          cp -r build/_app "$RUNNER_TEMP/tv-web/"
          (
            cd "$RUNNER_TEMP/tv-web"
            git init -q -b tv-web
            git add -A
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "TV web bundle for ${GITHUB_SHA::7}"
            git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" tv-web
            git rev-parse HEAD > ../tv-web-commit
          )
          jq --arg c "$(cat "$RUNNER_TEMP/tv-web-commit")" '.commit = $c' build/tv-web.json > tv-web.json
          jq '{version, native, commit, files: (.files | length)}' tv-web.json

          # A pre-release, never the latest: that's the version release (below).
          notes="The Samsung TV app's newest build ($(git log -1 --format=%h)) and its over-the-air update. To install, use the latest release's Stremio.wgt (TizenBrew Installer: Cummmies/custom-stremio). See docs/samsung-tv.md."
          if ! gh release view tv >/dev/null 2>&1; then
            gh release create tv --target "$GITHUB_SHA" --prerelease --latest=false --title "Samsung TV (newest build)" --notes "$notes"
          fi
          gh release edit tv --prerelease --latest=false --title "Samsung TV (newest build)" --notes "$notes"
          gh release upload tv Stremio.wgt tv-web.json --clobber

      # A version tag: the .wgt goes to that version's release.
      - uses: ./.github/actions/release
        if: steps.secrets.outputs.ok == 'true' && github.ref_type == 'tag'

      - name: Add to the release
        if: steps.secrets.outputs.ok == 'true' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" Stremio.wgt --clobber

  purge:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Purge jsDelivr
        run: |
          for f in package.json $(git ls-files tv); do
            for name in gh/${{ github.repository }} gh/${{ github.repository }}@main; do
              curl -sS "https://purge.jsdelivr.net/$name/$f" -o /dev/null -w "%{http_code} $name/$f\n" || true
            done
          done
