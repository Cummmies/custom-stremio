# The Samsung TV app (docs/samsung-tv.md).
#
# app: builds the app's TV version (hash routing, Stremio's core compiled for
#   the TV's WebAssembly), packages it as an installable TV app (.wgt) signed
#   with the certificate from tv-cert.yml, and publishes it as the repository's
#   latest release, where TizenBrew Installer finds it: Cummmies/custom-stremio.
# purge: the tv/ test module is loaded by TizenBrew through jsDelivr, which
#   caches a branch's files for up to 12 hours; this clears that cache.
name: TV

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'static/**'
      - 'package.json'
      - 'package-lock.json'
      - 'svelte.config.js'
      - 'vite.config.js'
      - 'scripts/build-core-tv.sh'
      - 'scripts/strip-wasm-section.py'
      - 'tv/**'
      - '.github/workflows/tv.yml'
  workflow_dispatch:

concurrency:
  group: tv
  cancel-in-progress: true

env:
  TIZEN_STUDIO_VER: '5.6'

jobs:
  app:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check the certificate secrets
        id: secrets
        env:
          KEY: ${{ secrets.TIZEN_AUTHOR_KEY }}
          PW: ${{ secrets.TIZEN_AUTHOR_KEY_PW }}
        run: |
          if [ -z "$KEY" ] || [ -z "$PW" ]; then
            echo "::warning::No certificate yet (see tv-cert.yml): signing with a throwaway one to test the build; not publishing."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Stremio's core without WebAssembly reference types (scripts/build-core-tv.sh),
      # cached per core version.
      - name: Core version
        id: core
        run: |
          echo "version=$(node -p "require('./node_modules/@stremio/stremio-core-web/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "dir=$RUNNER_TEMP/core-tv" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: core-cache
        with:
          path: ${{ steps.core.outputs.dir }}
          key: core-tv-${{ steps.core.outputs.version }}-${{ hashFiles('scripts/build-core-tv.sh', 'scripts/strip-wasm-section.py') }}

      - name: Get the core's source
        if: steps.core-cache.outputs.cache-hit != 'true'
        id: src
        run: |
          git clone --quiet --filter=blob:none https://github.com/Stremio/stremio-core "$RUNNER_TEMP/stremio-core"
          git -C "$RUNNER_TEMP/stremio-core" checkout --quiet "stremio-core-web-v${{ steps.core.outputs.version }}"
          WB=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3; exit }' "$RUNNER_TEMP/stremio-core/Cargo.lock")
          echo "wasm-bindgen $WB"
          echo "wasm_bindgen=$WB" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.core-cache.outputs.cache-hit != 'true'
        with:
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        if: steps.core-cache.outputs.cache-hit != 'true'
        with:
          tool: wasm-bindgen-cli@${{ steps.src.outputs.wasm_bindgen }}

      - name: Build the core
        if: steps.core-cache.outputs.cache-hit != 'true'
        env:
          CORE_SRC: ${{ runner.temp }}/stremio-core
        run: |
          # The core pins its Rust version (rust-toolchain.toml); add the target to it.
          (cd "$CORE_SRC/stremio-core-web" && rustup target add wasm32-unknown-unknown)
          scripts/build-core-tv.sh "${{ steps.core.outputs.dir }}"

      - name: Build the app (TV)
        env:
          TV_BUILD: '1'
          CORE_DIR: ${{ steps.core.outputs.dir }}
        run: |
          # Hash routing allows no page options; ssr = false is implied there.
          sed -i '/export const ssr/d' src/routes/+layout.ts
          npm run build
          # The app opens from a local file: start from paths relative to it.
          sed -i 's#"/_app/#"./_app/#g; s#href="/favicon#href="./favicon#' build/index.html
          grep -c '"./_app/' build/index.html

      - name: Install Tizen Studio (command line)
        run: |
          sudo apt-get install -y expect
          curl -fsSLo tizen-installer "https://download.tizen.org/sdk/Installer/tizen-studio_${TIZEN_STUDIO_VER}/web-cli_Tizen_Studio_${TIZEN_STUDIO_VER}_ubuntu-64.bin"
          chmod +x tizen-installer
          ./tizen-installer --accept-license "$HOME/tizen-studio"
          rm tizen-installer
          echo "TIZEN=$HOME/tizen-studio/tools/ide/bin/tizen" >> "$GITHUB_ENV"

      # Our author certificate, and the SDK's public distributor certificate
      # (the one Tizen 6.5 and older TVs accept in developer mode).
      - name: Set up signing
        env:
          KEY: ${{ secrets.TIZEN_AUTHOR_KEY }}
          PW: ${{ secrets.TIZEN_AUTHOR_KEY_PW }}
        run: |
          DATA="$HOME/tizen-signing"
          mkdir -p "$DATA"
          if [ -n "$KEY" ] && [ -n "$PW" ]; then
            echo "$KEY" | base64 -d > "$DATA/author.p12"
          else
            PW=throwaway
            "$TIZEN" certificate -a Throwaway -p "$PW" -c US -n "Throwaway" -f throwaway-author
            cp "$(find "$HOME" -name 'throwaway-author.p12' | head -1)" "$DATA/author.p12"
          fi
          SDK="$HOME/tizen-studio/tools/certificate-generator/certificates"
          cat > "$DATA/profiles.xml" <<XML
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <profiles active="CustomStremio" version="3.1">
          <profile name="CustomStremio">
          <profileitem ca="$SDK/developer/tizen-developer-ca.cer" distributor="0" key="$DATA/author.p12" password="$PW" rootca=""/>
          <profileitem ca="$SDK/distributor/sdk-public/tizen-distributor-ca.cer" distributor="1" key="$SDK/distributor/sdk-public/tizen-distributor-signer.p12" password="tizenpkcs12passfordsigner" rootca=""/>
          <profileitem ca="" distributor="2" key="" password="" rootca=""/>
          </profile>
          </profiles>
          XML
          sed -i 's/^ *//' "$DATA/profiles.xml"
          "$TIZEN" cli-config "profiles.path=$DATA/profiles.xml"

      - name: Assemble
        run: |
          rm -rf wgt && mkdir wgt
          cp -r build/. wgt/
          cp tv/wgt/config.xml wgt/
          cp src-tauri/icons/128x128.png wgt/icon.png
          # A new version each build, so the TV takes it as an update.
          sed -i "s/version=\"0.1.0\"/version=\"0.1.${{ github.run_number }}\"/" wgt/config.xml
          du -sh wgt

      - name: Build and sign
        run: |
          cd wgt
          "$TIZEN" build-web -e ".*"
          expect -c "set timeout 300; spawn $TIZEN package -t wgt -s CustomStremio -o $GITHUB_WORKSPACE/out -- .buildResult; expect eof"
          cd ..
          WGT=$(ls out/*.wgt | head -1)
          if [ -z "$WGT" ]; then
            cat "$HOME"/tizen-studio-data/cli/logs/cli.log 2>/dev/null | tail -50 || true
            echo "::error::No .wgt was made."
            exit 1
          fi
          mv "$WGT" CustomStremio.wgt
          ls -lh CustomStremio.wgt
          unzip -l CustomStremio.wgt | grep -E "signature|config.xml|index.html|\.wasm"

      - uses: actions/upload-artifact@v4
        with:
          name: CustomStremio-tv
          path: CustomStremio.wgt

      # TizenBrew Installer installs the first .wgt of the latest release.
      - name: Publish
        if: steps.secrets.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view tv >/dev/null 2>&1; then
            gh release create tv --target "$GITHUB_SHA" --latest --title "Samsung TV" \
              --notes "The Samsung TV app. Install with TizenBrew Installer: Cummmies/custom-stremio. See docs/samsung-tv.md."
          fi
          gh release edit tv --title "Samsung TV" --latest \
            --notes "The Samsung TV app ($(git log -1 --format=%h)). Install with TizenBrew Installer: Cummmies/custom-stremio. See docs/samsung-tv.md."
          gh release upload tv CustomStremio.wgt --clobber

  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Purge jsDelivr
        run: |
          for f in package.json $(git ls-files tv); do
            for name in gh/${{ github.repository }} gh/${{ github.repository }}@main; do
              curl -sS "https://purge.jsdelivr.net/$name/$f" -o /dev/null -w "%{http_code} $name/$f\n" || true
            done
          done
