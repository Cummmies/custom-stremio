# Publishes the app's web side (everything under src/) as a signed bundle the
# iOS app downloads by itself (src-tauri/src/web_update.rs), so most changes
# reach the phone without re-sideloading.
#
# The files go to a pre-release named "web" (never "latest", which the desktop
# updater reads). Pushes to test go to "web-beta" instead, for devices with
# Beta Updates on (Settings; web_update.rs). Signed with the updater key:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
name: Web update

on:
  push:
    branches: [main, test]
    paths:
      - 'src/**'
      - 'static/**'
      - 'package.json'
      - 'package-lock.json'
      - 'svelte.config.js'
      - 'vite.config.js'
      - 'src-tauri/native-api.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-update-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # What's New lists recent commits (vite.config.js).
          fetch-depth: 100

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Package and sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Add the repository secret TAURI_SIGNING_PRIVATE_KEY (the contents of ~/.tauri/custom-stremio.key on your PC). Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          # The commit's time orders bundles; the iOS build from the same
          # commit has the same number built in, so it won't re-download itself.
          VERSION=$(git log -1 --format=%ct)
          LABEL="$(date -u -d @"$VERSION" '+%b %-d') · ${GITHUB_SHA::7}"
          NATIVE_API=$(tr -dc '0-9' < src-tauri/native-api.txt)
          (cd build && zip -qr ../web.zip .)
          npx tauri signer sign web.zip
          printf '{"version":%s,"nativeApi":%s,"label":"%s"}\n' "$VERSION" "$NATIVE_API" "$LABEL" > web.json
          cat web.json
          ls -lh web.zip web.zip.sig

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name == 'test' && 'web-beta' || 'web' }}
          TITLE: ${{ github.ref_name == 'test' && 'Beta web updates (Windows and iOS)' || 'Web updates (Windows and iOS)' }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "$TITLE" \
            --notes "The Windows and iOS apps download their screens from here. Not an installable release."
          # web.json last, so an app never sees a version whose files aren't up yet.
          gh release upload "$TAG" web.zip web.zip.sig --clobber
          gh release upload "$TAG" web.json --clobber
